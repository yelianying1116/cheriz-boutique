
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact événement - Cheriz</title>

    <link rel="stylesheet" href="contact-evenement.css">
</head>

<body>

    <main class="event-page">

        <section class="event-card">

            <h1>Par où voulez-vous commencer ?</h1>

            <p class="event-subtitle">
                On vous oriente vers la bonne solution en quelques secondes.
            </p>


            <!-- ==========================================
                 ÉTAPE 1
            =========================================== -->

            <div class="event-step active" id="step-1">

                <h2>Quel est votre besoin ?</h2>

                <div class="select-wrapper">
                    <select id="need" name="need">
                        <option value="" selected disabled>
                            Sélectionnez votre besoin
                        </option>

                        <option value="GHAJKGHAUR">
                            GHAJKGHAUR
                        </option>

                        <option value="hkhuhgoq">
                            hkhuhgoq
                        </option>

                        <option value="fglrgji">
                            fglrgji
                        </option>

                        <option value="fnalrnl">
                            fnalrnl
                        </option>
                    </select>
                </div>

                <div class="button-row">
                    <button
                        type="button"
                        class="continue-button"
                        id="continue-1">
                        Continuer
                    </button>
                </div>

            </div>


            <!-- ==========================================
                 ÉTAPE 2
            =========================================== -->

            <div class="event-step" id="step-2">

                <h2>Taille et type d'entreprise</h2>

                <div class="select-wrapper">
                    <select id="company-size" name="companySize">
                        <option value="" selected disabled>
                            Sélectionnez une option
                        </option>

                        <option value="0 a 1 salarie">
                            0 a 1 salarie
                        </option>

                        <option value="2 a 10 salarie">
                            2 a 10 salarie
                        </option>

                        <option value="11 a 30 salarie">
                            11 a 30 salarie
                        </option>

                        <option value="30 a 1000 salarie">
                            30 a 1000 salarie
                        </option>
                    </select>
                </div>


                <label for="project-description" class="field-label">
                    Décrivez votre projet (optionnel)
                </label>

                <textarea
                    id="project-description"
                    name="projectDescription"
                    rows="5"
                    placeholder="Décrivez votre projet..."></textarea>


                <div class="button-row">

                    <button
                        type="button"
                        class="back-button"
                        id="back-2">
                        Retour
                    </button>

                    <button
                        type="button"
                        class="continue-button"
                        id="continue-2">
                        Continuer
                    </button>

                </div>

            </div>


            <!-- ==========================================
                 ÉTAPE 3
            =========================================== -->

            <form
                class="event-step"
                id="step-3">

                <h2>Vos coordonnées</h2>


                <label for="name" class="field-label">
                    Nom
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required>


                <label for="phone" class="field-label">
                    Téléphone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    required>


                <label for="email" class="field-label">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>


                <div class="button-row">

                    <button
                        type="button"
                        class="back-button"
                        id="back-3">
                        Retour
                    </button>

                    <button
                        type="submit"
                        class="continue-button submit-button">
                        Envoyer ma demande
                    </button>

                </div>

            </form>


            <!-- ==========================================
                 MESSAGE DE SUCCÈS
            =========================================== -->

            <div
                class="success-message"
                id="success-message">

                <h2>Merci pour votre demande !</h2>

                <p>
                    Votre demande a bien été envoyée.
                    Nous reviendrons vers vous rapidement.
                </p>

            </div>

        </section>

    </main>


    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="event-footer">
        <p>© Cheriz - Bien Manger Community</p>
    </footer>


    <script src="contact-evenement.js"></script>

</body>
</html>
